<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" role="img" aria-labelledby="title desc">
  <title id="title">EX288 Cobertura Prática — 80%</title>
  <desc id="desc">Cobertura prática dos estudos para o repositório de laboratório EX288. Último bloco concluído: Helm com cold sim. Foco atual: OpenShift Pipelines / Tekton.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#07111f"/>
    </linearGradient>

    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="55%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="900" height="220" rx="24" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="10" y="10" width="900" height="4" rx="2" fill="url(#accent)"/>

  <text x="48" y="58" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">
    EX288 • Cobertura Prática
  </text>

  <text x="48" y="84" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">
    Advanced Developer in Cloud-native Applications
  </text>

  <rect x="48" y="112" width="760" height="22" rx="11" fill="#1e293b"/>
  <rect x="48" y="112" width="608" height="22" rx="11" fill="url(#progress)"/>

  <rect x="824" y="101" width="64" height="44" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="856" y="129" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    72%
  </text>

  <circle cx="56" cy="174" r="5" fill="#22c55e"/>
  <text x="70" y="179" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">
    Concluído: Helm • cold sim
  </text>

  <circle cx="56" cy="204" r="5" fill="#38bdf8"/>
  <text x="70" y="209" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">
    Foco atual: OpenShift Pipelines / Tekton
  </text>

  <text x="888" y="207" text-anchor="end" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">
    cobertura ≠ nota da prova
  </text>
</svg>
