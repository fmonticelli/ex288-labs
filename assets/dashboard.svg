<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">EX288 — Dashboard de Estudos</title>
  <desc id="desc">Dashboard visual da cobertura prática dos estudos EX288. Cobertura estimada em 89%, Pipeline/PipelineRun, params e workspaces com PVC praticados; próximo foco troubleshooting de Tekton.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="52%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="55%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="current" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <style>
      .title { font: 700 26px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .section { font: 700 16px Inter, Segoe UI, Arial, sans-serif; fill: #e2e8f0; }
      .label { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .small { font: 400 12px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .tiny { font: 400 11px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .value { font: 700 22px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .domain { font: 600 11px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect x="10" y="10" width="900" height="500" rx="26" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="10" y="10" width="900" height="4" rx="2" fill="url(#progress)"/>

  <text x="42" y="54" class="title">EX288 • Dashboard de Estudos</text>
  <text x="42" y="78" class="subtitle">Advanced Developer in Cloud-native Applications</text>

  <rect x="36" y="104" width="552" height="142" rx="18" fill="#0f172a" stroke="#1e293b"/>
  <text x="58" y="132" class="section">Cobertura prática</text>
  <text x="58" y="153" class="small">Estimativa de conteúdo já praticado no laboratório</text>
  <rect x="58" y="176" width="438" height="18" rx="9" fill="#1e293b"/>
  <rect x="58" y="176" width="389.8" height="18" rx="9" fill="url(#progress)"/>
  <rect x="512" y="161" width="54" height="48" rx="14" fill="#111827" stroke="#334155"/>
  <text x="539" y="191" text-anchor="middle" class="value">89%</text>

  <circle cx="62" cy="220" r="5" fill="#22c55e"/>
  <text x="76" y="225" class="small">Forte/praticado: 12 áreas</text>
  <circle cx="252" cy="220" r="5" fill="#f59e0b"/>
  <text x="266" y="225" class="small">Revisar: 6 pontos</text>
  <circle cx="408" cy="220" r="5" fill="#64748b"/>
  <text x="422" y="225" class="small">Pendentes: 2 áreas</text>

  <rect x="604" y="104" width="280" height="142" rx="18" fill="#0f172a" stroke="#1e293b"/>
  <text x="626" y="132" class="section">Situação atual</text>
  <circle cx="632" cy="162" r="6" fill="#22c55e"/>
  <text x="648" y="166" class="small">Último praticado</text>
  <text x="648" y="185" class="label">Tekton • Pipeline/PVC</text>
  <circle cx="632" cy="210" r="6" fill="#38bdf8"/>
  <text x="648" y="214" class="small">Próximo foco</text>
  <text x="648" y="233" class="label">Troubleshooting Tekton</text>

  <text x="42" y="282" class="section">Roadmap prático</text>
  <text x="42" y="302" class="small">Visão rápida do caminho já percorrido e do que vem a seguir</text>

  <g>
    <rect x="36" y="322" width="78" height="74" rx="14" fill="#0d1f1a" stroke="#14532d"/>
    <circle cx="52" cy="340" r="5" fill="#22c55e"/>
    <text x="47" y="366" class="domain">Git / CLI</text>
    <text x="47" y="384" class="tiny">concluído</text>

    <rect x="122" y="322" width="78" height="74" rx="14" fill="#0d1f1a" stroke="#14532d"/>
    <circle cx="138" cy="340" r="5" fill="#22c55e"/>
    <text x="133" y="366" class="domain">Imagens</text>
    <text x="133" y="384" class="tiny">concluído</text>

    <rect x="208" y="322" width="78" height="74" rx="14" fill="#0d1f1a" stroke="#14532d"/>
    <circle cx="224" cy="340" r="5" fill="#22c55e"/>
    <text x="219" y="366" class="domain">Builds</text>
    <text x="219" y="384" class="tiny">concluído</text>

    <rect x="294" y="322" width="78" height="74" rx="14" fill="#0d1f1a" stroke="#14532d"/>
    <circle cx="310" cy="340" r="5" fill="#22c55e"/>
    <text x="305" y="366" class="domain">S2I</text>
    <text x="305" y="384" class="tiny">concluído</text>

    <rect x="380" y="322" width="78" height="74" rx="14" fill="#0d1f1a" stroke="#14532d"/>
    <circle cx="396" cy="340" r="5" fill="#22c55e"/>
    <text x="391" y="366" class="domain">Deploy</text>
    <text x="391" y="384" class="tiny">concluído</text>

    <rect x="466" y="322" width="78" height="74" rx="14" fill="#0d1f1a" stroke="#14532d"/>
    <circle cx="482" cy="340" r="5" fill="#22c55e"/>
    <text x="477" y="366" class="domain">Probes</text>
    <text x="477" y="384" class="tiny">concluído</text>

    <rect x="552" y="322" width="78" height="74" rx="14" fill="#0d1f1a" stroke="#14532d"/>
    <circle cx="568" cy="340" r="5" fill="#22c55e"/>
    <text x="563" y="362" class="domain">Config /</text>
    <text x="563" y="376" class="domain">Secrets</text>
    <text x="563" y="390" class="tiny">concluído</text>

    <rect x="638" y="322" width="102" height="74" rx="14" fill="#0d1f1a" stroke="#14532d"/>
    <circle cx="656" cy="340" r="5" fill="#22c55e"/>
    <text x="650" y="362" class="domain">Multi-container</text>
    <text x="650" y="378" class="domain">Pods</text>
    <text x="650" y="392" class="tiny">concluído</text>
  </g>

  <rect x="748" y="316" width="136" height="86" rx="16" fill="url(#current)" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="766" cy="338" r="6" fill="#38bdf8"/>
  <text x="760" y="362" class="domain">Tekton</text>
  <text x="760" y="379" class="domain">Pipelines</text>
  <text x="760" y="394" class="tiny">foco atual</text>

  <rect x="36" y="422" width="848" height="62" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <text x="56" y="447" class="label">Pontos para revisar</text>
  <text x="56" y="468" class="small">Probes timings • Deployment ImageChange • ImageStreams troubleshooting • Custom Builder • S2I incremental</text>

  <text x="864" y="502" text-anchor="end" class="tiny">cobertura ≠ nota da prova</text>
</svg>
