apiVersion: apps/v1
kind: Deployment
metadata:
  name: kustomize-app
  labels:
    app: kustomize-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kustomize-app
  template:
    metadata:
      labels:
        app: kustomize-app
    spec:
      containers:
        - name: kustomize-app
          image: registry.access.redhat.com/ubi9/ubi
          ports:
            - name: http
              containerPort: 8080
          command:
            - bash
            - -c
            - python3 -m http.server 8080
