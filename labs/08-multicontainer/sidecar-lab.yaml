apiVersion: v1
kind: Pod
metadata:
  name: sidecar-lab
  namespace: monticelli-ex288
spec:
  volumes:
    - name: logs
      emptyDir:
  containers:
    - name: app
      image: registry.access.redhat.com/ubi9/ubi-minimal
      command:
        - bash
        - -c
        - while true; do echo "$(date) app trabalhando" >> /logs/app.log; sleep 5; done
      volumeMounts:
      - name: logs
        mountPath: /logs
    - name: sidecar
      image: registry.access.redhat.com/ubi9/ubi-minimal
      command:
        - bash
        - -c
        - tail -F /logs/app.log
      volumeMounts:
      - name: logs
        mountPath: /logs