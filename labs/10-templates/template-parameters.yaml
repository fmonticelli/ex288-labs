apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: basic-template
  namespace: monticelli-ex288
objects:
  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      labels:
        app: ${APP_NAME}
      name: ${APP_NAME}
    spec:
      replicas: 1
      selector:
        matchLabels: 
          app: ${APP_NAME}
      template:
        metadata:
          labels:
            app: ${APP_NAME}
        spec:
          containers:
            - name: ${APP_NAME}
              image: ${IMAGE}
              command:
                - bash
                - -c
                - python3 -m http.server 8080
              env:
                - name: ENVIRONMENT
                  value: ${ENVIRONMENT}
                - name: RANDOM_ID
                  value: ${RANDOM_ID}
  - kind: Service
    apiVersion: v1
    metadata:
      labels:
        app: ${APP_NAME}
      name: ${APP_NAME}
    spec:
      selector:
        app: ${APP_NAME}
      ports:
        - name: http
          port: 8080
          targetPort: 8080
parameters:
  - name: APP_NAME
    value: template-app
  - name: IMAGE
    value: registry.access.redhat.com/ubi9/ubi
  - name: ENVIRONMENT
    required: true
  - name: RANDOM_ID
    generate: expression
    from: '[a-zA-Z0-9]{8}'
