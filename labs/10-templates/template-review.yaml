apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: template-review-app
labels:
  app: ${APP_NAME}

parameters:
  - name: APP_NAME
    value: review-app
  - name: IMAGE
    value: registry.access.redhat.com/ubi9/ubi

objects:
  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: ${APP_NAME}
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${APP_NAME}
      template:
        metadata:
          labels:
            app: ${APP_NAME}
        spec:
          containers:
            - name: ${APP_NAME}
              image: ${IMAGE}
              command:
                - bash
                - -c
                - python3 -m http.server 8080

  - kind: Service
    apiVersion: v1
    metadata:
      name: ${APP_NAME}
    spec:
      ports:
        - name: http
          port: 8080
          targetPort: 8080
      selector:
        app: ${APP_NAME}