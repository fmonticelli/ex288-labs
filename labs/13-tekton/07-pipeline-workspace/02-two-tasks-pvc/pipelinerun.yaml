apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: app-workspace-pipeline-run
spec:
  workspaces:
    - name: shared-data
      persistentVolumeClaim:
        claimName: app-build-data
  params:
    - name: APP_NAME
      value: "inventory-api"
    - name: VERSION
      value: "3.2"
    - name: ENVIRONMENT
      value: "production"
  pipelineRef:
    name: app-workspace-pipeline