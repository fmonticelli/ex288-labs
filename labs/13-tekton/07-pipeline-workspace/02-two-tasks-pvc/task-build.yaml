apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: app-workspace-build
spec:
  params:
    - name: APP_NAME
    - name: VERSION
  workspaces:
    - name: shared-data
  steps:
    - name: build
      image: registry.access.redhat.com/ubi9/ubi
      command:
        - bash
        - -c
        - | 
          echo "Application: $(params.APP_NAME)" > "$(workspaces.shared-data.path)/artifact.txt";
          echo "Version: $(params.VERSION)" >> "$(workspaces.shared-data.path)/artifact.txt";
          echo "Build: SUCCESS" >> "$(workspaces.shared-data.path)/artifact.txt";