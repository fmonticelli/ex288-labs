apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: workspace-demo
spec:
  workspaces:
    - name: shared-data
  steps:
    - name: write
      image: registry.access.redhat.com/ubi9/ubi
      command:
        - bash
        - -c
        - 'echo "hello from workspace" > /workspace/shared-data/message.txt'

    - name: read
      image: registry.access.redhat.com/ubi9/ubi
      command:
        - bash
        - -c
        - 'cat /workspace/shared-data/message.txt'