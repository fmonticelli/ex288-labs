apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: hello-task-params
  labels:
    app: hello-task-params
spec:
  params:
    - name: MESSAGE
      type: string
      default: "default message"

  steps:
    - name: echo
      image: registry.access.redhat.com/ubi9/ubi
      command:
        - bash
        - -c
      args:
        - 'echo "$(params.MESSAGE)"'